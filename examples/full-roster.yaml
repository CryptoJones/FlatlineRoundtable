  - name: Neuromancer
    active: true
    vendor: openrouter
    harness: http
    model: deepseek/deepseek-v4-flash
    base_url: https://openrouter.ai/api/v1
    key_entry: openrouter/agent/neuromancer
    # metered
    max_tokens: 10000
    # Also a reasoning model, which was missed when the others were sized:
    # measured 3253-6293 reasoning tokens plus a 1522-2114 token answer on a
    # 24k-token brief, so it needs ~8400 and had 2000. It failed a long brief
    # for exactly the same reason the free lanes did.
    #
    # Metered, so this is sized to the measurement rather than given the open
    # headroom the free lanes get. It does inflate the worst-case pre-flight
    # estimate, which is the safe direction -- billing is on actual tokens.
    extra_body:
      # 17 endpoints spanning fp8 and fp4 (Sail Research, AtlasCloud serve 4-bit).
      # fp4 is what produced SHODAN's stray-glyph corruption, so bound the
      # candidate set to fp8 -- no bf16 endpoint exists for this model. `order`
      # expresses preference within that set; fallbacks stay on but can only land
