name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual only. The smoke job below spends money and depends on vendors being
  # up, neither of which belongs in the gate every PR waits on.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The dependency budget is one package: `cryptography`, which backs the
      # encrypted store. PyYAML left with #109 -- only the one-time import-yaml
      # uses it, and it is installed below for that job alone. If this line
      # grows a second package, the budget was breached -- that is not a
      # routine change.
      - name: Install dependencies
        run: python3 -m pip install --quiet cryptography

      - name: Test suite (no PyYAML -- what a run has)
        run: python3 -m unittest discover -s tests -v

      # The import-yaml tests skip without PyYAML, so run the suite once more
      # with it, on one version, to keep the migration path covered.
      - name: Test suite with PyYAML (import-yaml)
        if: matrix.python-version == '3.14'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest discover -s tests
          python3 -m pip uninstall --quiet --yes pyyaml

      # A throwaway key file stands in for `pass`, which the runner does not have.
      # The store is built in $RUNNER_TEMP so the check cannot be affected by,
      # or affect, a real store on the runner.
      - name: 'Store: db init, migrate twice, doctor, import the CI roster'
        run: |
          export ROUNDTABLE_DB_KEY_FILE="$RUNNER_TEMP/db.key" XDG_DATA_HOME="$RUNNER_TEMP/data"
          ./roundtable db init
          ./roundtable db migrate
          ./roundtable db migrate
          ./roundtable db doctor
          ./roundtable db import tests/fixtures/ci-roster.json --replace
          ./roundtable lanes list
          ./roundtable db export | diff - tests/fixtures/ci-roster.json
          ./roundtable db doctor

      # --list must resolve every route from the store alone. Point the process
      # at a dead proxy: if any lane dials out here it fails loudly, rather than
      # silently costing money the first time someone adds a real key.
      - name: '--list makes no network calls'
        run: |
          export ROUNDTABLE_DB_KEY_FILE="$RUNNER_TEMP/db.key" XDG_DATA_HOME="$RUNNER_TEMP/data"
          HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
          ALL_PROXY=http://127.0.0.1:9 \
          ./roundtable --list

      # --init in a throwaway HOME: creates a store when there is none, leaves an
      # existing one byte-identical, and fails loudly (non-zero, with the cause)
      # when it cannot create one.
      - name: 'install.sh --init: create, leave alone, explain failure'
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/init-data"
          export ROUNDTABLE_DB_KEY_FILE="$RUNNER_TEMP/init.key"
          ./install.sh --init
          ./roundtable db doctor
          before=$(sha256sum "$XDG_DATA_HOME/flatline-roundtable/roundtable.db")
          ./install.sh --init | grep -q "left untouched"
          test "$before" = "$(sha256sum "$XDG_DATA_HOME/flatline-roundtable/roundtable.db")"
          mkdir -p "$RUNNER_TEMP/ro" && chmod 500 "$RUNNER_TEMP/ro"
          if XDG_DATA_HOME="$RUNNER_TEMP/ro" ROUNDTABLE_DB_KEY_FILE="$RUNNER_TEMP/ro.key" \
                ./install.sh --init 2> init-err.txt; then
            echo "--init succeeded on an unwritable store dir"; exit 1
          fi
          grep -q "roundtable db init failed (exit" init-err.txt
          grep -q "Store path" init-err.txt

      - name: 'A YAML --config is refused with the import-yaml pointer'
        run: |
          # `! cmd` never fails a step under bash -e, so test the status explicitly.
          if ./roundtable --config tests/fixtures/legacy-example.yaml --list 2> err.txt; then
            echo "a YAML --config was accepted"; exit 1
          fi
          grep -q "roundtable import-yaml" err.txt

      - name: 'No PyYAML on the run path'
        run: |
          test "$(grep -cE '^\s*(import yaml|from yaml)' roundtable)" -eq 1

  # Opt-in: answers "is the shape still right TODAY", which the golden fixtures
  # cannot -- they answer "is it still what it was when captured". Allowed to
  # fail without blocking anything, because a vendor being down is not a defect
  # in this repo.
  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python3 -m pip install --quiet cryptography
      - name: Compare a live response against the fixture contract
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "No OPENROUTER_API_KEY secret set — skipping live smoke."
            exit 0
          fi
          python3 scripts/live-smoke.py
