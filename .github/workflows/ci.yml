name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual only. The smoke job below spends money and depends on vendors being
  # up, neither of which belongs in the gate every PR waits on.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyYAML is the tool's only dependency and it is deliberately the only one.
      # If this line ever grows a second package, that is a signal the
      # dependency budget was breached, not a routine change.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Test suite
        run: python3 -m unittest discover -s tests -v

      # --list must resolve every route from config alone. Point the process at
      # a dead proxy: if any lane dials out here it fails loudly, rather than
      # silently costing money the first time someone adds a real key.
      # --config is used rather than seeding $HOME so the check cannot be
      # affected by, or affect, a real config on the runner.
      - name: '--list makes no network calls'
        run: |
          HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
          ALL_PROXY=http://127.0.0.1:9 \
          ./roundtable --config tests/fixtures/ci-config.yaml --list

      - name: Shipped example config parses
        run: |
          python3 -c "import yaml; yaml.safe_load(open('FlatlineRoundtable.yaml.example')); print('example config OK')"

  # Opt-in: answers "is the shape still right TODAY", which the golden fixtures
  # cannot -- they answer "is it still what it was when captured". Allowed to
  # fail without blocking anything, because a vendor being down is not a defect
  # in this repo.
  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Compare a live response against the fixture contract
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "No OPENROUTER_API_KEY secret set — skipping live smoke."
            exit 0
          fi
          python3 scripts/live-smoke.py
